<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Grand Theft Auto V style logo</title>
  <desc id="desc">Black background with white Grand Theft Auto style lettering and a green V emblem on a banner.</desc>
  <defs>
    <linearGradient id="greenGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#69e66c"/>
      <stop offset="50%" stop-color="#2fb25d"/>
      <stop offset="100%" stop-color="#0d6d35"/>
    </linearGradient>
    <pattern id="mesh" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 12 L12 0 M-2 2 L2 -2 M10 14 L14 10" stroke="rgba(12,80,30,0.9)" stroke-width="1.2"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="#000000"/>

  <g filter="url(#shadow)">
    <g transform="translate(130 80)">
      <text x="0" y="220" font-size="260" font-weight="900" letter-spacing="-16" font-family="Impact, 'Arial Black', sans-serif" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="18">grand</text>
      <text x="30" y="470" font-size="260" font-weight="900" letter-spacing="-16" font-family="Impact, 'Arial Black', sans-serif" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="18">theft</text>
      <text x="30" y="725" font-size="260" font-weight="900" letter-spacing="-16" font-family="Impact, 'Arial Black', sans-serif" fill="#f3f3f3" stroke="#1a1a1a" stroke-width="18">auto</text>
    </g>

    <g transform="translate(790 150)">
      <path d="M0 420 L270 0 L540 420 H468 L360 235 L270 420 L180 235 L72 420 Z" fill="#f4f3ef" stroke="#1a1a1a" stroke-width="14" stroke-linejoin="round"/>
      <path d="M270 50 L336 180 L270 330 L204 180 Z" fill="url(#greenGrad)" stroke="#1a1a1a" stroke-width="14"/>
      <path d="M72 420 Q190 352 270 420 Q350 352 468 420" fill="none" stroke="#1a1a1a" stroke-width="14" stroke-linecap="round"/>
      <path d="M96 500 Q170 434 248 500 Q270 522 290 500 Q368 434 442 500" fill="none" stroke="#1a1a1a" stroke-width="16" stroke-linecap="round"/>
      <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle">
        <text x="270" y="450" font-size="110" fill="#0f0f0f">FIVE</text>
      </g>
    </g>

    <g transform="translate(420 430)">
      <path d="M0 0 L220 300 L370 0 L300 0 L220 170 L140 0 Z" fill="url(#greenGrad)" stroke="#1a1a1a" stroke-width="18" stroke-linejoin="round"/>
      <path d="M0 0 L220 300 L370 0 L300 0 L220 170 L140 0 Z" fill="url(#mesh)" opacity="0.85"/>
    </g>
  </g>
</svg>
