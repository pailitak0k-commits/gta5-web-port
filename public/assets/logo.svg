<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">Grand Theft Auto V style logo</title>
  <desc id="desc">A Grand Theft Auto-inspired logo with a large white stencil wordmark and green V emblem.</desc>
  <defs>
    <linearGradient id="greenGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#5edb70"/>
      <stop offset="50%" stop-color="#2f9b50"/>
      <stop offset="100%" stop-color="#0f6c39"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7df9a"/>
      <stop offset="100%" stop-color="#b78c2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity="0.75"/>
    </filter>
    <pattern id="mesh" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 12 L12 0 M-4 4 L4 -4 M8 16 L16 8" stroke="rgba(20,120,40,0.9)" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="1200" height="900" fill="#000"/>

  <g filter="url(#shadow)">
    <g transform="translate(120 90)">
      <text x="0" y="220" font-family="Impact, Arial Black, sans-serif" font-size="260" font-weight="900" letter-spacing="-18" fill="#f3f3f3" stroke="#1d1d1d" stroke-width="18">grand</text>
      <text x="32" y="470" font-family="Impact, Arial Black, sans-serif" font-size="260" font-weight="900" letter-spacing="-18" fill="#f3f3f3" stroke="#1d1d1d" stroke-width="18">theft</text>
      <text x="36" y="730" font-family="Impact, Arial Black, sans-serif" font-size="260" font-weight="900" letter-spacing="-18" fill="#f3f3f3" stroke="#1d1d1d" stroke-width="18">auto</text>
    </g>

    <g transform="translate(420 500)">
      <path d="M0 0 L200 290 L350 0 L285 0 L200 180 L115 0 Z" fill="url(#greenGrad)" stroke="#1d1d1d" stroke-width="18" stroke-linejoin="round"/>
      <path d="M0 0 L200 290 L350 0 L285 0 L200 180 L115 0 Z" fill="url(#mesh)" opacity="0.85"/>
    </g>

    <g transform="translate(610 220) scale(1.25)">
      <path d="M0 370 L278 0 L555 370 H478 L390 210 L278 370 L170 210 L80 370 Z" fill="#f3f4f2" stroke="#1d1d1d" stroke-width="18" stroke-linejoin="round"/>
      <path d="M278 60 L350 178 L278 330 L206 178 Z" fill="url(#greenGrad)" stroke="#1d1d1d" stroke-width="16"/>
      <path d="M0 372 Q130 320 278 372 Q430 320 555 372" fill="none" stroke="#1d1d1d" stroke-width="18" stroke-linecap="round"/>
      <path d="M68 556 Q150 500 235 556 Q278 588 320 556 Q410 500 490 556" fill="none" stroke="#1d1d1d" stroke-width="20" stroke-linecap="round"/>
      <g font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle">
        <text x="278" y="500" font-size="118" fill="#0b0b0b">FIVE</text>
      </g>
    </g>
  </g>
</svg>
